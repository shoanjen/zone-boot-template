# 开发环境配置
server:
  port: 8212

# 连接信息使用 Spring Boot 官方键（zone-middleware 已去方言化）
spring:
  datasource:
    # 开发环境直连共享 MySQL 实例，独立 database 隔离
    url: jdbc:mysql://localhost:3306/zone_boot_template?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
  data:
    redis:
      # 开发环境使用 db 1，避免与其他项目冲突
      host: localhost
      port: 6379
      database: 1

# 日志配置
logging:
  level:
    root: INFO
    com.zone.boot: DEBUG
    org.springframework.web: DEBUG

# Knife4j开发环境配置
knife4j:
  enable: true
  basic:
    enable: true
    username: admin
    password: 123456
  setting:
    enable-debug: true
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
